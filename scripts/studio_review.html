<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流光 Lumora · 设计评审</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#edf2ee;font:13px/1.5 system-ui}header{padding:14px 20px;display:flex;gap:16px;align-items:center;border-bottom:1px solid #30333b;flex-wrap:wrap}strong{font-size:16px;margin-right:auto}label{display:flex;align-items:center;gap:8px;color:#b2b6c1}select,button,a{font:inherit;color:inherit;background:#25272e;border:1px solid #666c7c;border-radius:5px;padding:7px 10px;text-decoration:none}button{cursor:pointer}main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#30333b}section{min-width:0;background:#101114}h2{font-size:12px;font-weight:500;margin:0;padding:9px 20px;color:#b2b6c1}iframe{border:0;width:100%;height:calc(100vh - 128px);display:block;background:#101114}.single main{grid-template-columns:1fr}.single #old-pane{display:none}footer{padding:8px 20px;color:#b2b6c1;font-size:11px}@media(max-width:900px){main{grid-template-columns:1fr}#old-pane{display:none}header{gap:8px}iframe{height:calc(100vh - 200px)}}</style><link rel="stylesheet" href="/static/scrollbars.css?v=20260908-lumora9-2">

</head><body class="single"><header><strong>流光 Lumora / 全站预览</strong><label>页面<select id="route"><option value="/login">电影感登录</option><option value="/app">生成工作台</option><option value="/app/jobs/101/page?state=completed">任务详情 · 已完成</option><option value="/app/jobs/101/page">任务详情 · 处理中</option><option value="/app/jobs/101/page?state=failed">任务详情 · 失败</option><option value="/admin/users/page">后台用户</option><option value="/app/jobs/page">任务记录</option><option value="/app/job-batches/page">批次记录</option><option value="/app/job-batches/12/result">批次详情</option><option value="/app/library/page">我的作品</option><option value="/app/plaza/page">视频广场</option><option value="/app/reference-images/page">个人素材</option><option value="/app/quota/page">我的额度</option><option value="/app/guide/page">创作指南</option><option value="/admin">运营概览</option><option value="/admin/jobs/page">任务管理</option><option value="/admin/job-batches/page">批次管理</option><option value="/admin/jobs/page?batch_id=12">后台批次详情</option><option value="/admin/users/2/page">用户详情</option><option value="/admin/queue/page">队列</option><option value="/admin/download-failures/page">下载异常</option><option value="/admin/usage/monthly/page">用量报表</option><option value="/admin/rankings/page">排行</option><option value="/admin/quota-plans/page">套餐</option><option value="/admin/quota-requests/page">审批</option><option value="/admin/quota-ledger/page">流水</option><option value="/admin/provider-keys/page">密钥</option><option value="/admin/reference-images/page">参考图</option><option value="/admin/risk-control/page">风控</option><option value="/admin/settings/page">系统设置</option><option value="/admin/api-call-logs/page">调用日志</option><option value="/admin/audit-logs/page">审计日志</option><option value="/preview/access-denied">无权访问</option></select></label><label>外观<select id="theme" data-theme-select><option value="dark">深色</option><option value="light">浅色</option><option value="system">跟随系统</option></select></label><label>请求<select id="scenario"><option value="">模拟成功</option><option value="error">模拟失败</option></select></label><button id="compare">新旧并列</button><a id="direct" href="/login" target="_blank">独立打开</a></header><main><section id="old-pane"><h2>上一版</h2><iframe id="old" title="上一版界面"></iframe></section><section><h2>专业创作工作台 · 新设计</h2><iframe id="new" title="新设计界面"></iframe></section></main><footer>本地模拟数据。登录、提交和保存均为模拟响应，不连接业务数据库或付费上游。全站已接入统一工作台组件。</footer><script>const route=document.getElementById('route'),theme=document.getElementById('theme'),scenario=document.getElementById('scenario'),before=document.getElementById('old'),after=document.getElementById('new');function apply(frame){try{const d=frame.contentDocument;d.querySelectorAll('[data-theme-select]').forEach(s=>{s.value=theme.value;s.dispatchEvent(new Event('change',{bubbles:true}));});d.documentElement.dataset.theme=theme.value==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme.value;}catch(e){}}function load(){localStorage.setItem('sora.theme',theme.value);const suffix=scenario.value?(route.value.includes('?')?'&':'?')+'scenario='+scenario.value:'';before.src='/before'+route.value.split('?')[0];after.src=route.value+suffix;document.getElementById('direct').href=after.src;}before.onload=()=>apply(before);after.onload=()=>apply(after);route.onchange=load;scenario.onchange=load;theme.onchange=()=>{localStorage.setItem('sora.theme',theme.value);apply(before);apply(after);};document.getElementById('compare').onclick=e=>{document.body.classList.toggle('single');e.target.textContent=document.body.classList.contains('single')?'新旧并列':'只看新版';};try{theme.value=localStorage.getItem('sora.theme')||'system';}catch(_){theme.value='system';}load();</script></body></html>
