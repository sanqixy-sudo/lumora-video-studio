<section class="wb-page-heading">
  <div>
    <h2>参考图管理</h2>
  </div>
  <a class="ghost-btn small-btn" href="/admin/provider-keys/page">返回密钥管理</a>
</section>

<form data-create-editor="新增参考图" action="/admin/reference-images/form" method="post" class="stack-form refined-form provider-key-form-grid">
    <label>归属
      <select name="owner_user_id">
        <option value="">通用预设</option>
        
      </select>
    </label>
    <label>预设名称<input autocomplete="off" name="name" required maxlength="128" placeholder="医院场景首帧…" /></label>
    <label class="wide-field">图片链接<input autocomplete="off" name="image_url" required type="url" placeholder="https://example.com/image.webp…" /></label>
    <label>排序<input inputmode="numeric" autocomplete="off" name="sort_order" type="number" value="100" min="0" /></label>
    <div class="form-submit-cell"><button class="primary-btn" type="submit">保存预设</button></div>
  </form>

<section class="wb-panel top-gap">
  <form class="filter-bar modern-filter" method="get" action="/admin/reference-images/page">
    <label><span>范围</span>
      <select name="scope">
        <option value="all" >全部</option>
        <option value="common" >通用预设</option>
        <option value="user" >用户预设</option>
      </select>
    </label>
    <label><span>状态</span>
      <select name="status">
        <option value="all" >全部</option>
        <option value="active" >启用</option>
        <option value="disabled" >暂停</option>
      </select>
    </label>
    <label><span>用户</span>
      <select name="user_id">
        <option value="">全部用户</option>
        
      </select>
    </label>
    <button class="primary-btn small-btn" type="submit">筛选</button>
    <a class="ghost-btn small-btn" href="/admin/reference-images/page">重置</a>
  </form>

  
  <div class="preset-grid-admin">
    
    <article class="preset-admin-card">
      <div class="preset-admin-preview"><img width="720" height="1280" src="https://example.com/ref.png" alt="竖屏人物" loading="lazy" referrerpolicy="no-referrer" /></div>
      <div class="preset-admin-body">
        <div class="preset-admin-title"><strong>竖屏人物</strong><span class="badge status-active">启用</span></div>
        <p class="muted tiny"></p>
        <p class="muted tiny">720x1280 / 9:16 / 排序 1</p>
        <p class="mono-line tiny">https://example.com/ref.png</p>
        <div class="inline-actions">
          <form action="/admin/reference-images/1/toggle/form" method="post"><button class="ghost-btn small-btn" type="submit">暂停</button></form>
          <button class="ghost-btn small-btn" type="button" data-toggle-edit="preset-edit-1">修改</button>
          <form action="/admin/reference-images/1/delete/form" method="post" data-confirm-message="确认删除这个预设？"><button class="danger-btn small-btn" type="submit">删除</button></form>
        </div>
        <form id="preset-edit-1" action="/admin/reference-images/1/update/form" method="post" class="stack-form refined-form hidden top-gap">
          <label>归属
            <select name="owner_user_id">
              <option value="" selected>通用预设</option>
              
            </select>
          </label>
          <label>名称<input autocomplete="off" name="name" value="竖屏人物" required maxlength="128" /></label>
          <label>图片链接<input autocomplete="off" name="image_url" value="https://example.com/ref.png" required type="url" /></label>
          <label>排序<input inputmode="numeric" autocomplete="off" name="sort_order" type="number" min="0" value="1" /></label>
          <button class="primary-btn small-btn" type="submit">保存修改</button>
        </form>
      </div>
    </article>
    
  </div>
</section>
