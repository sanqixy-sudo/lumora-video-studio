    <main class="wb-main" id="main-content" tabindex="-1"><header class="wb-page-heading"><div><h2>系统设置</h2><p>配置后续任务的生成、下载和额度规则。</p></div></header>
<section class="wb-panel task-tabs-card"><div class="section-head"><h2>运行配置</h2><span class="muted tiny">所有分组一起保存，空值按默认规则处理。</span></div>
<form action="/admin/settings/update/form" method="post" class="settings-form">
<div class="settings-layout"><nav class="tab-nav" aria-label="设置分组"><button class="tab-button active" data-tab-target="settings-1" type="button">生成与队列</button><button class="tab-button " data-tab-target="settings-2" type="button">下载与重试</button><button class="tab-button " data-tab-target="settings-3" type="button">用户与额度</button></nav><div>
<section class="tab-panel active" data-tab-panel="settings-1">
<h3 class="setting-group-title">生成与队列</h3><div class="settings-grid">

<label class="setting-item"><span>全站并发运行数 <small class="muted">个</small></span>
<input inputmode="numeric" autocomplete="off" name="max_running_jobs" value="3" type="number" min="0" step="1" />
<small class="setting-help">全站同时执行的生成任务上限。<br>默认：3 · 保存后用于后续处理</small></label>

<label class="setting-item"><span>提交上游最大重试 <small class="muted">次</small></span>
<input inputmode="numeric" autocomplete="off" name="submit_max_attempts" value="3" type="number" min="0" step="1" />
<small class="setting-help">提交失败时允许的最大尝试次数。<br>默认：3 · 保存后用于后续处理</small></label>
</div></section><section class="tab-panel " data-tab-panel="settings-2">
<h3 class="setting-group-title">下载与重试</h3><div class="settings-grid">

<label class="setting-item"><span>下载重试间隔秒 <small class="muted">秒</small></span>
<input inputmode="text" autocomplete="off" name="download_retry_delays_seconds" value="0,15,30,60,120,180,300,600,900,1200"  />
<small class="setting-help">按顺序设置下载重试间隔，用英文逗号分隔。<br>默认：0,15,30,60,120,180,300,600,900,1200 · 保存后用于后续处理</small></label>

<label class="setting-item"><span>临时下载链接有效期秒 <small class="muted">秒</small></span>
<input inputmode="numeric" autocomplete="off" name="public_download_token_ttl_seconds" value="86400" type="number" min="0" step="1" />
<small class="setting-help">新生成的临时下载链接有效时间。<br>默认：86400 · 保存后用于后续处理</small></label>

<label class="setting-item"><span>远端处理中最短轮询秒数（至少 6000） <small class="muted">秒</small></span>
<input inputmode="numeric" autocomplete="off" name="content_fallback_after_seconds" value="6000" type="number" min="0" step="1" />
<small class="setting-help">上游仍处理中时等待多久再尝试下载探测；运行时至少等待 6000 秒。<br>默认：6000 · 保存后用于后续处理</small></label>
</div></section><section class="tab-panel " data-tab-panel="settings-3">
<h3 class="setting-group-title">用户与额度</h3><div class="settings-grid">

<label class="setting-item"><span>开放用户注册</span>
<select name="registration_enabled"><option value="0" selected>关闭</option><option value="1" >开启</option></select>

<small class="setting-help">是否允许用户自行注册账号。<br>默认：关闭 · 保存后用于后续处理</small></label>

<label class="setting-item"><span>默认每日提交上限 <small class="muted">个 / 天</small></span>
<input inputmode="numeric" autocomplete="off" name="default_daily_job_limit" value="" type="number" min="0" step="1" />
<small class="setting-help">用户未单独设置时采用此限制；留空表示不限制。<br>默认：不限 · 保存后用于后续处理</small></label>

<label class="setting-item"><span>默认用户同时生成数 <small class="muted">个</small></span>
<input inputmode="numeric" autocomplete="off" name="default_concurrent_job_limit" value="" type="number" min="0" step="1" />
<small class="setting-help">用户未单独设置时允许的同时生成数量；留空表示不限制。<br>默认：不限 · 保存后用于后续处理</small></label>

<label class="setting-item"><span>默认提交间隔秒 <small class="muted">秒</small></span>
<input inputmode="numeric" autocomplete="off" name="default_min_submit_interval_seconds" value="" type="number" min="0" step="1" />
<small class="setting-help">两次提交之间的最短间隔；留空表示不限制。<br>默认：不限 · 保存后用于后续处理</small></label>
</div></section></div></div>
<div class="form-footer"><button class="primary-btn" type="submit">保存全部设置</button></div></form></section>
