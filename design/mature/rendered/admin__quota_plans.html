<section class="wb-page-heading">
  <div><h2>套餐设置</h2></div>
</section>

<form data-create-editor="新增套餐" action="/admin/quota-plans/form" method="post" class="stack-form refined-form">
    <label>套餐名称<input autocomplete="off" name="name" required placeholder="例如：周套餐 A…" /></label>
    <label>周期<select name="period_type"><option value="daily">日套餐</option><option value="weekly">周套餐</option><option value="monthly">月套餐</option></select></label>
    <label>周期额度<input inputmode="numeric" autocomplete="off" name="quota_amount" type="number" min="0" required /></label>
    <div class="inline-actions"><button class="primary-btn" type="submit">新增套餐</button></div>
  </form>

<section class="wb-panel top-gap">
  
  <div class="table-wrap surface-table clean-table-wrap">
    <table class="table clean-table">
      <thead><tr><th>ID</th><th>名称</th><th>周期</th><th>额度</th><th>绑定人数</th><th>状态</th><th class="action-col">操作</th></tr></thead>
      <tbody>
        
        
        <tr>
          <td>#1</td>
          <td>创作月套餐</td>
          <td>monthly</td>
          <td>100</td>
          <td>4</td>
          <td><span class="badge status-active">启用</span></td>
          <td class="action-cell">
            <details class="row-editor">
              <summary class="ghost-btn small-btn">编辑</summary>
              <form action="/admin/quota-plans/1/update/form" method="post" class="stack-form action-card">
                <label>套餐名称<input autocomplete="off" name="name" value="创作月套餐" required /></label>
                <label>周期<select name="period_type"><option value="daily" >日套餐</option><option value="weekly" >周套餐</option><option value="monthly" selected>月套餐</option></select></label>
                <label>周期额度<input inputmode="numeric" autocomplete="off" name="quota_amount" type="number" min="0" value="100" required /></label>
                <button class="primary-btn small-btn" type="submit">保存</button>
              </form>
            </details>
            <form action="/admin/quota-plans/1/toggle/form" method="post" class="inline-form" data-confirm-submit="停用套餐会自动解绑所有用户，确定继续？">
              <button class="ghost-btn small-btn" type="submit">停用</button>
            </form>

        </tr>
