<section class="wb-page-heading"><div><span class="mature-eyebrow">用户与额度</span><h1>用户管理</h1><p>管理成员账号、访问权限与生成额度。</p></div><button type="button" class="primary-btn" data-open-drawer="wb-user-drawer"><svg class="wb-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<path stroke-linecap="round" d="M12 4.5v15m7.5-7.5h-15"/>

</svg>新建用户</button></section>
<section class="wb-user-metrics" aria-label="用户统计"><div><span>全部用户</span><strong>6</strong></div><div><span>启用中</span><strong>5</strong></div><div><span>已禁用</span><strong>1</strong></div><div><span>子管理员</span><strong>1</strong></div></section>
<section class="wb-user-directory"><form class="wb-user-filters" method="get" action="/admin/users/page">
      <label><span>搜索用户 / ID</span><input autocomplete="off" name="q" value="" placeholder="输入账号名或用户 ID…" /></label>
      <label><span>角色</span><select name="role">
        <option value="all" selected>全部角色</option>
        <option value="user" >普通用户</option>
        <option value="sub_admin" >子管理员</option>
        <option value="admin" >主管理员</option>
      </select></label>
      <label><span>状态</span><select name="status">
        <option value="all" selected>全部状态</option>
        <option value="active" >启用</option>
        <option value="disabled" >禁用</option>
      </select></label>
      <div class="filter-actions">
        <button class="secondary-btn small-btn" type="submit">查询</button>
        <a class="ghost-btn small-btn" href="/admin/users/page">重置</a>
      </div>
    </form><div class="table-wrap"><table class="table wb-user-table">
        <thead><tr><th>用户</th><th>角色</th><th>状态</th><th>报表</th><th>额度</th><th>已用</th><th>限速/并发</th><th class="action-col">操作</th></tr></thead>
        <tbody>
          
          <tr><td colspan="8"><div class="empty-state compact-empty">暂无用户，创建第一个账号。</div></td></tr>
          
        </tbody>
      </table></div><div class="wb-list-foot"><span>当前列表 0 位用户</span><span>角色与额度独立管理</span></div></section>
<dialog id="wb-user-drawer" class="wb-drawer" aria-labelledby="wb-user-drawer-title"><header class="wb-dialog-head"><div><h2 id="wb-user-drawer-title">新建用户</h2><p>创建账号并分配访问权限。</p></div><button type="button" class="icon-btn" data-close-drawer aria-label="关闭新建用户"><svg class="wb-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<path stroke-linecap="round" d="m6 6 12 12M6 18 18 6"/>

</svg></button></header><div class="wb-dialog-body"><form action="/admin/users/form" method="post" id="wb-create-user-form" class="stack-form" data-async-json="/admin/users" data-success-redirect="/admin/users/page?notice=user_created" data-success-message="用户已创建">
      <label>用户名<input spellcheck="false" autocomplete="off" name="username" required /></label>
      <label>显示名称<input autocomplete="off" name="display_name" placeholder="例如：三七团队…" /></label>
      <label>密码<input autocomplete="new-password" name="password" type="password" required /></label>
      <label>角色<select name="role"><option value="user">普通用户</option><option value="sub_admin">子管理员</option><option value="admin">主管理员</option></select></label>
      <button type="submit" class="primary-btn" data-loading-text="正在创建">创建用户</button>
    </form></div></dialog>
